name: weekly-report
on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC = 8am PT (7am in winter)
  workflow_dispatch:
concurrency:
  group: trencher-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: ${{ github.workspace }}/data
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Analyze rules
        run: python3 scanner.py analyze > /dev/null
      - name: Weekly review + self-tuning (Claude)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          PROMPT="$(cat weekly_prompt.md
            echo; echo STATS:; python3 scanner.py stats
            echo; echo ANALYSIS:; cat data/analysis.json
            echo; echo CONFIG:; python3 -c 'import json;print(json.load(open("data/dashboard.json"))["tuning"]["effective"])' 2>/dev/null
            echo; echo TUNING:; cat data/tuning.json 2>/dev/null || echo '{}'
            echo; echo NOTEBOOK:; cat data/learnings.md 2>/dev/null || echo '(empty - first week)')"
          claude -p "$PROMPT" --permission-mode dontAsk --allowedTools "" > data/weekly_out.txt
          python3 scanner.py tune
      - name: Export + save
        run: |
          python3 scanner.py export
          cd data
          git config user.name "trencher-bot"; git config user.email "trencher-bot@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -qm "weekly $(date -u +%F)"
          git push -qf origin snapshot:data

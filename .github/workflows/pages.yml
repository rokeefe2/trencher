name: pages
# Publishes dashboard/ as the phone web app at https://<owner>.github.io/<repo>/.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the web app files (not server.py or local settings)
        run: |
          mkdir -p _site/icons
          cp dashboard/index.html dashboard/manifest.webmanifest dashboard/sw.js _site/
          cp dashboard/icons/* _site/icons/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

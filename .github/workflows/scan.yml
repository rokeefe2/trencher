name: scan
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: trencher-data
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_DIR: ${{ github.workspace }}/data
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - name: Track open paper trades
        run: python3 scanner.py track
      - name: Scan
        id: scan
        run: echo "n=$(python3 scanner.py scan | python3 -c 'import json,sys;print(json.load(sys.stdin)["to_review"])')" >> "$GITHUB_OUTPUT"
      - name: Claude review
        if: steps.scan.outputs.n != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          PROMPT="$(cat review_prompt.md; echo; echo CANDIDATES:; cat data/candidates.json; echo; echo STATS:; python3 scanner.py stats)"
          claude -p "$PROMPT" --permission-mode dontAsk --allowedTools "" > data/review_out.txt || echo "claude failed" >> data/review_out.txt
          python3 scanner.py record
      - name: Export dashboard data
        run: python3 scanner.py export
      - name: Save data (single-commit data branch)
        run: |
          cd data
          git config user.name "trencher-bot"; git config user.email "trencher-bot@users.noreply.github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf origin snapshot:data
